          - heading "Главное" [level=2] [ref=e76]
          - paragraph [ref=e77]:
            - strong [ref=e78]: Ситуация.
            - text: "С 1 сентября 2025 года реклама на Instagram и Facebook полностью запрещена в России. 59% блогеров ушли в Telegram, но легальной централизованной площадки для рекламы не существует. Рынок инфлюенсер-маркетинга — 58 млрд руб. в 2024 году (рост 30%+ в год), при этом ~25% рекламы в Telegram размещается без маркировки. Штрафы за отсутствие erid: 187 постановлений за 5 месяцев 2025 года на 11.5 млн руб."
          - paragraph [ref=e79]:
            - strong [ref=e80]: Что решает AdWall.
          - table [ref=e81]:
