                - cell "100% compliance с ФЗ о рекламе — erid, ЕРИР, отчётность" [ref=e162]
              - row "3 Агрегация аудитории всех блогеров Крупные рекламодатели покупают рекламные места на площадке с трафиком" [ref=e163]:
                - cell "3" [ref=e164]
                - cell "Агрегация аудитории всех блогеров" [ref=e165]
                - cell "Крупные рекламодатели покупают рекламные места на площадке с трафиком" [ref=e166]
              - row "4 Бесплатно для блогеров Блогеры не платят комиссию — монетизация через продажу рекламных мест" [ref=e167]:
                - cell "4" [ref=e168]
                - cell "Бесплатно для блогеров" [ref=e169]
                - cell "Блогеры не платят комиссию — монетизация через продажу рекламных мест" [ref=e170]
          - paragraph [ref=e171]:
            - strong [ref=e172]: Суть продукта.
            - text: "AdWall — Pinterest-подобная витрина с вертикальным видео (TikTok-механика). Блогер в своих соцсетях (Telegram, VK, Max) упоминает товар и даёт ссылку на AdWall. На платформе — легальное размещение: название, описание, промо, ссылка на покупку, автоматическая маркировка erid. У каждого блогера — стилизованная страница-портфолио. Площадка зарабатывает на продаже рекламных мест в интерфейсе крупным рекламодателям (баннеры, промо-позиции, подборки по тегам)."
          - paragraph [ref=e173]:
            - strong [ref=e174]: Позиционирование.
            - text: AdWall — частная площадка, полностью соответствующая требованиям ФЗ о рекламе. Платформа интегрирована с ОРД/ЕРИР и обеспечивает прозрачность рекламного рынка.
          - separator [ref=e175]
          - heading "1. О проекте" [level=2] [ref=e176]
          - heading "1.1 Концепция" [level=3] [ref=e177]
          - paragraph [ref=e178]: "AdWall — легальная рекламная платформа, объединяющая три модели:"
          - list [ref=e179]:
            - listitem [ref=e180]:
              - strong [ref=e181]: Pinterest
              - text: — визуальный каталог с карточками товаров и услуг, организация по коллекциям и категориям
            - listitem [ref=e182]:
              - strong [ref=e183]: TikTok
              - text: — вертикальное видео как основной формат контента, свайп-лента для бесконечного скролла
            - listitem [ref=e184]:
              - strong [ref=e185]: Telegram
              - text: — прямая коммуникация между блогером и аудиторией, подписки, уведомления
          - paragraph [ref=e186]: "Блогер создаёт рекламный контент (видео-обзор, фото с описанием, текстовую рекомендацию) и публикует его на платформе. В своих соцсетях блогер размещает ссылку: \"Подробнее — на AdWallе\". Пользователь переходит, смотрит контент, открывает для себя другие товары через рекомендации и хэштеги."
          - heading "1.2 Бизнес-модель" [level=3] [ref=e187]
          - paragraph [ref=e188]:
            - strong [ref=e189]: "Ключевой принцип: блогеры не платят."
            - text: Монетизация — через продажу рекламных мест крупным рекламодателям.
