          - heading "Главное" [level=2] [ref=e143]
          - paragraph [ref=e144]:
            - strong [ref=e145]: Ситуация.
            - text: "С 1 сентября 2025 года реклама на Instagram и Facebook полностью запрещена в России. 59% блогеров ушли в Telegram, но легальной централизованной площадки для рекламы не существует. Рынок инфлюенсер-маркетинга — 58 млрд руб. в 2024 году (рост 30%+ в год), при этом ~25% рекламы в Telegram размещается без маркировки. Штрафы за отсутствие erid: 187 постановлений за 5 месяцев 2025 года на 11.5 млн руб."
          - paragraph [ref=e146]:
            - strong [ref=e147]: Что решает AdWall.
          - table [ref=e148]:
            - rowgroup [ref=e149]:
              - row "# Результат Эффект" [ref=e150]:
                - columnheader "#" [ref=e151]
                - columnheader "Результат" [ref=e152]
                - columnheader "Эффект" [ref=e153]
            - rowgroup [ref=e154]:
              - row "1 Единая легальная площадка Блогеры размещают рекламу без юридических рисков, со встроенной маркировкой" [ref=e155]:
                - cell "1" [ref=e156]
                - cell "Единая легальная площадка" [ref=e157]
                - cell "Блогеры размещают рекламу без юридических рисков, со встроенной маркировкой" [ref=e158]
